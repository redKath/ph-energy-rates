[project]
name = "ph-energy-data"
version = "0.1.0"
description = "Open dataset of Philippine electricity rates per kWh, by utility and month, with source provenance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local OCR/table recovery for scanned PDFs (large: PyTorch + models).
ocr = ["docling>=2.0"]
# LLM fallback extractor.
llm = ["anthropic>=0.40"]

[project.scripts]
ph-energy = "ph_energy_data.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_energy_data"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501", "UP007", "UP035"]

[tool.ruff.lint.isort]
known-first-party = ["ph_energy_data", "tests"]

[[tool.mypy.overrides]]
module = ["docling.*"]
ignore_missing_imports = true
